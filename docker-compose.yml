services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juan-portfolio
    ports:
      - "5525:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
